name: 'HIPAA Compliance Scan'
description: 'Scan your codebase for HIPAA compliance issues with vlayer'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'

  baseline-file:
    description: 'Path to baseline file for comparison'
    required: false
    default: ''

  min-confidence:
    description: 'Minimum confidence level (high, medium, low)'
    required: false
    default: 'low'

  exclude-patterns:
    description: 'Comma-separated glob patterns to exclude'
    required: false
    default: ''

  fail-on:
    description: 'Severity levels that cause failure (critical, high, medium, low)'
    required: false
    default: 'critical,high'

  output-format:
    description: 'Report format (json, html, markdown)'
    required: false
    default: 'json'

  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}

  generate-attestation:
    description: >-
      Also generate a VLayer technical-compliance attestation
      (.vlayer/attestation.json) for the checked-out commit. Optional; existing
      scan behavior is unchanged when this is false.
    required: false
    default: 'false'

  sign-attestation:
    description: >-
      Cryptographically sign the attestation with Sigstore (keyless). Requires
      generate-attestation, a clean working tree, and the calling workflow to
      grant `permissions: { id-token: write }` for OIDC.
    required: false
    default: 'false'

outputs:
  total-findings:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total }}

  new-findings:
    description: 'Number of new findings (not in baseline)'
    value: ${{ steps.scan.outputs.new }}

  critical-findings:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical }}

  high-findings:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high }}

  attestation-path:
    description: 'Path to the generated attestation (empty when not generated)'
    value: ${{ steps.attest.outputs.attestation-path }}

  policy-conclusion:
    description: >-
      VLayer technical policy conclusion for the attested commit
      (pass | fail | review_required). Empty when no attestation was generated.
      NOTE: this is a technical-control conclusion within the evaluated scope,
      not a HIPAA compliance determination.
    value: ${{ steps.attest.outputs.policy-conclusion }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install vlayer
      shell: bash
      run: |
        echo "Installing vlayer..."
        npm install -g verification-layer

    - name: Build scan command
      id: build-cmd
      shell: bash
      run: |
        CMD="vlayer scan ${{ inputs.path }} -f ${{ inputs.output-format }} -o hipaa-results.json"

        if [ -n "${{ inputs.baseline-file }}" ]; then
          CMD="$CMD --baseline ${{ inputs.baseline-file }}"
        fi

        if [ -n "${{ inputs.min-confidence }}" ]; then
          CMD="$CMD --min-confidence ${{ inputs.min-confidence }}"
        fi

        if [ -n "${{ inputs.exclude-patterns }}" ]; then
          CMD="$CMD --exclude \"${{ inputs.exclude-patterns }}\""
        fi

        echo "command=$CMD" >> $GITHUB_OUTPUT

    - name: Run HIPAA scan
      id: scan
      shell: bash
      continue-on-error: true
      run: |
        ${{ steps.build-cmd.outputs.command }}

        # Parse results
        if [ -f hipaa-results.json ]; then
          TOTAL=$(jq -r '.summary.total' hipaa-results.json)
          NEW=$(jq -r '.summary.unacknowledged' hipaa-results.json)
          CRITICAL=$(jq -r '.summary.critical' hipaa-results.json)
          HIGH=$(jq -r '.summary.high' hipaa-results.json)

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
        fi

    - name: Generate VLayer attestation
      id: attest
      if: inputs.generate-attestation == 'true'
      shell: bash
      run: |
        set -euo pipefail

        ATTEST_CMD="vlayer attest ${{ inputs.path }} -o .vlayer/attestation.json"

        # Signing requires OIDC and an immutable (clean) snapshot. The calling
        # workflow must grant `permissions: { id-token: write }`.
        if [ "${{ inputs.sign-attestation }}" = "true" ]; then
          ATTEST_CMD="$ATTEST_CMD --sign"
        fi

        # `vlayer attest` exits non-zero on a real failure (not a repo, dirty
        # tree, signing error). Do not let a policy FAIL be confused with a
        # tooling error: capture the conclusion from the document itself.
        $ATTEST_CMD || echo "::warning::vlayer attest exited non-zero"

        if [ -f .vlayer/attestation.json ]; then
          CONCLUSION=$(jq -r '.predicate.policy.conclusion' .vlayer/attestation.json)
          echo "attestation-path=.vlayer/attestation.json" >> $GITHUB_OUTPUT
          echo "policy-conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "### VLayer attestation" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`$(jq -r '.predicate.target.commit' .vlayer/attestation.json)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Policy conclusion: **$CONCLUSION**" >> $GITHUB_STEP_SUMMARY
          echo "- Controls evaluated: $(jq -r '.predicate.scope.coverage.controlsEvaluated' .vlayer/attestation.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Controls not evaluated: $(jq -r '.predicate.scope.coverage.controlsNotEvaluated | length' .vlayer/attestation.json)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_A VLayer policy conclusion is a technical-control statement about the evaluated scope. It is not a HIPAA compliance determination._" >> $GITHUB_STEP_SUMMARY
        else
          echo "attestation-path=" >> $GITHUB_OUTPUT
          echo "policy-conclusion=" >> $GITHUB_OUTPUT
        fi

    - name: Upload attestation
      if: inputs.generate-attestation == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: vlayer-attestation
        path: |
          .vlayer/attestation.json
          .vlayer/attestation.sigstore.json
        if-no-files-found: ignore

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hipaa-scan-results
        path: hipaa-results.json

    - name: Check failure conditions
      shell: bash
      run: |
        if [ ! -f hipaa-results.json ]; then
          echo "❌ Scan failed - no results file generated"
          exit 1
        fi

        CRITICAL=$(jq -r '.summary.critical' hipaa-results.json)
        HIGH=$(jq -r '.summary.high' hipaa-results.json)

        SHOULD_FAIL=false

        if [[ "${{ inputs.fail-on }}" == *"critical"* ]] && [ "$CRITICAL" -gt 0 ]; then
          echo "❌ Found $CRITICAL critical findings"
          SHOULD_FAIL=true
        fi

        if [[ "${{ inputs.fail-on }}" == *"high"* ]] && [ "$HIGH" -gt 0 ]; then
          echo "❌ Found $HIGH high severity findings"
          SHOULD_FAIL=true
        fi

        if [ "$SHOULD_FAIL" = true ]; then
          exit 1
        fi

        echo "✅ HIPAA scan passed"
