name: Anthropic SDK refresh

on:
  push:
    branches: [chore/anthropic-sdk-security]
    paths:
      - '.github/workflows/anthropic-sdk-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: chore/anthropic-sdk-security

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Update Anthropic SDK lockfile
        run: npm install '@anthropic-ai/sdk@^0.124.0' --package-lock-only

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit dependency update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'fix: update Anthropic SDK security release'
          git push origin HEAD:chore/anthropic-sdk-security
