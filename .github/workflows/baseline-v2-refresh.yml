name: Stage portable vlayer baseline

on:
  push:
    branches: [feat/compliance-delivery-v1]
    paths:
      - '.github/workflows/baseline-v2-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/compliance-delivery-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Regenerate portable baseline
        run: |
          node dist/cli.js baseline . -o .vlayer-baseline.json --config .vlayerrc.json
          test "$(jq -r '.version' .vlayer-baseline.json)" = "2.0"
          jq -e '[.findings[] | select((.file | startswith("/")) and (.file != "project-level"))] | length == 0' .vlayer-baseline.json
      - name: Commit baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .vlayer-baseline.json
          if git diff --cached --quiet; then
            echo 'Baseline already current'
          else
            git commit -m 'chore: migrate scanner baseline to portable v2'
            git push origin HEAD:feat/compliance-delivery-v1
          fi
