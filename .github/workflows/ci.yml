name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The published rule counts are GENERATED from rule-catalog.json into
      # marker-delimited blocks. This fails if a block was hand-edited, or if the
      # catalog changed without the docs being regenerated — the drift that let
      # README claim 131 rules while the engine held 143.
      - name: Rule counts are not stale
        run: npm run check:rule-counts

      # A retracted claim needs a guard, not just a deletion. The retracted
      # coverage line lived in a GENERATED block, so removing it from README.md
      # alone would have let the generator rewrite it on the next build with no
      # diff a reviewer would notice. See scripts/check-claims.mjs for the list
      # and the reason each was withdrawn.
      - name: No retracted marketing claims
        run: npm run check:claims

      - name: Run tests
        run: npm run test:run

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
