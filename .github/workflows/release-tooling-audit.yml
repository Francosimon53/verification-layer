name: Release tooling audit

on:
  push:
    branches: [chore/release-tooling-security]
    paths:
      - '.github/workflows/release-tooling-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
      - name: Inspect safe release tooling update path
        run: |
          echo '--- latest npm ---'
          npm view npm version engines
          echo '--- npm 11.16.1 ---'
          npm view npm@11.16.1 version engines
          echo '--- semantic-release 24 dependency ---'
          npm view semantic-release@24.2.9 dependencies.@semantic-release/npm engines
          echo '--- plugin 12 npm dependency ---'
          npm view @semantic-release/npm@12.0.2 dependencies.npm engines peerDependencies
          echo '--- baseline install ---'
          npm ci
          npm ls semantic-release @semantic-release/npm npm || true
          echo '--- baseline audit ---'
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
