name: Release tooling audit

on:
  push:
    branches: [chore/release-tooling-security]
    paths:
      - '.github/workflows/release-tooling-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: 'npm'
      - name: Compare semantic-release 25 dependency risk
        run: |
          npm ci
          npm audit --json > baseline.json || true
          echo '--- baseline ---'
          node -e "const a=require('./baseline.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          npm install 'semantic-release@25.0.9' --save-dev --package-lock-only
          npm audit --json > candidate.json || true
          echo '--- semantic-release 25 candidate ---'
          node -e "const a=require('./candidate.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          npm install --ignore-scripts
          npm ls semantic-release @semantic-release/npm npm || true
          npx semantic-release --version
