name: Release tooling refresh

on:
  push:
    branches: [chore/release-tooling-security]
    paths:
      - '.github/workflows/release-tooling-audit.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/release-tooling-security
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: 'npm'
      - name: Update semantic-release dependency
        run: |
          npm install 'semantic-release@25.0.9' --save-dev --package-lock-only
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update semantic-release security release'
          git push origin HEAD:chore/release-tooling-security
