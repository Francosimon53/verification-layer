name: Security lock refresh

on:
  push:
    branches: [chore/node20-security-audit]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Refresh non-breaking security fixes in lockfile
        run: npm audit fix --package-lock-only

      - name: Verify production dependency gate
        run: npm audit --omit=dev --audit-level=high

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
